<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            text-align: center;
        }
        header{
            margin: 50px auto;
        }
        header>h1{
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }
        header>h3{
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            font-size:24px
        }
        section{
            display: flex;
            justify-content: center;
        }
        section>div{
            margin: 0 20px;
            text-align: left;
            border: 1px solid gainsboro;
            padding: 10px;
            border-radius: 20px;
            box-shadow: 5px 5px 5px rgb(215, 215, 215);
        }
        section>div>div:first-child{
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <!-- 
        https://mdn.github.io/learning-area/javascript/oojs/json/superheroes.json
    -->
    <header id="header"></header>
    <section id="section"></section>

    <script>

        const header = document.getElementById('header');
        const section = document.getElementById('section');
        
        // HTML 문서가 로딩되면 호출 => DOMContentLoaded
        document.addEventListener('DOMContentLoaded',()=>{
            superHero().then(result => printData(result));
        });

        // 출력함수
        function printData(obj){
            console.log(obj);

            // header > h1 / h3
            let str='';
            str += `<h1>${obj.squadName}</h1>`;
            str += `<h3>HomeTown : ${obj.homeTown} / Formed : ${obj.formed}</h3>`;

            header.innerHTML = str;

            // section => div => div*4 => div> ul>li
            let i=0;
            for(let member of obj.members){
                i++;
                let memberStr = '<div>';
                    memberStr += `<div>${member.name}</div>`;
                    memberStr += `<div>SecretIdentity: ${member.secretIdentity}</div>`;
                    memberStr += `<div>Age: ${member.age}</div>`;
                    memberStr += `<div>SuperPowers : </div>`;
                    memberStr += `<ul id="power${i}"></ul>`;
                    memberStr += '</div>';

                    section.innerHTML += memberStr;

                    member.powers.forEach(v => {
                        document.getElementById(`power${i}`).innerHTML += `
                        <li>${v}</li>
                        `;
                    })

            }
            
        }

        // 데이터 로드
        async function superHero(){
            try{
                const resp = await fetch('https://mdn.github.io/learning-area/javascript/oojs/json/superheroes.json');
                const result = await resp.json();
                return result;
            }catch(err){
                console.log(err);
            }
        }


    </script>
</body>
</html>
