<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 
        1~99 까지 숫자 중 하나를 랜덤으로 선택하여 해당 숫자를 맞추는 게임
    -->
    <div>
        <button id="random">랜덤 숫자 생성 버튼</button>
        <button id="reset">다시시도</button>
        <h1 id="printMsg"></h1>
    </div>
    <div>
        <input type="text" id="myNum">
        <button id="compareNum">제출</button>
        <h1 id="result"></h1>
    </div>
    <script>
        const printMsg = document.getElementById('printMsg');
        const result = document.getElementById('result');
        let computerNumber=0;
        let count = 0;

        document.getElementById('compareNum').addEventListener('click',()=>{

            if(computerNumber == 0){
                result.innerText = '랜덤수가 생성되지 않습니다.';
                return;
            }

            let str = '';
            let myNum = document.getElementById('myNum').value;
            if(isNaN(myNum) || myNum <= 0 || myNum >= 100){
                str = `1~99까지의 숫자만 가능!! \n`;
            }else{
                count++;
                if(myNum == computerNumber){
                    str = `횟수: ${count}, 정답!! ${computerNumber}. \n`;
                }else if(computerNumber > myNum) {
                    str = `횟수: ${count}, ${myNum} => UP!! \n`;
                }else{
                    str = `횟수: ${count}, ${myNum} => Down!! \n`;
                }
            }
            result.innerText += str;
            // 다시 입력 가능한 상태로 input 창을 비워둠. 
            document.getElementById('myNum').value='';
        });

        document.getElementById('random').addEventListener('click',()=>{
            computerNumber = Math.floor(Math.random()*99)+1;
            printMsg.innerText = '컴퓨터가 랜덤수를 생성했습니다.(1~99)';
            console.log(computerNumber);
        });
        document.getElementById('reset').addEventListener('click',()=>{
            // 새로고침.
            window.location.reload(); 
            //location.reload();
        })
    </script>
</body>
</html>
