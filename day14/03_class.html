<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>
        class : 자바스크립트에서도 클래스 생성이 가능
    </h1>
    <!-- 
        객체의 구조를 표준화 시켜 관리를 쉽게 하기 위한 방법으로 사용.
        일반 자바스크립트의 페이지 에서는 잘 쓰지 않음. 
        대형 프로젝트에서 많이 사용.
        js로 백엔드를 구성할 때 주로 사용. 
        nest.JS 프레임워크 사용할때, typeScript의 대형 프로젝트 할 때 많이 사용.
        예전엔 react에서도 class 중심의 구조를 많이 사용했었음. 
        
        1. 객체 구조 관리가 편함. 
        2. 유지보수가 쉬움
        3. typeScript 프로젝트에서 많이 사용
    -->
    <!-- 
        클래스 생성 기본 문법
        class 클래스명{
            // 생성자 = 1개만 가능
            constructor(param){
                멤버변수 정의
            }

            // 메서드 정의
            methodName(param){
                ...
            }

            // getter/setter
            get name(){
                return this.name;
            }
            set name(value){
                this.name = value;
            }

        }
        
        new 클래스명();  // 생성자로 객체 생성
    -->
    <script>
        // javascript도 클래스 이름은 첫글자 대문자가 원칙
        class Car{
            // 생성자는 1개만 가능
            constructor(name, year){
                this.name = name;
                this.year = year;
                this.model='';
            }
        }

        const myCar1 = new Car('sonata', 2024);
        myCar1.model = 'XG';
        console.log(myCar1);

        const myCar2 = new Car();
        myCar2.name = '그렌져';
        myCar2.year = 2026;
        myCar2.model = "new";
        console.log(myCar2);

        const myCar3 = new Car();
        myCar3.name = '아반떼';
        myCar3.year = 2026;
        myCar3.model = "XD";
        myCar3.color = 'black';
        console.log(myCar3);
    </script>
</body>
</html>
